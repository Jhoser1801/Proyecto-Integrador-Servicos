spring.application.name=parking-integrator
server.port=8080
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

# Base de datos H2 (como en business-sales-project, el usuario y la contrasena van aqui).
# La primera vez, H2 crea la base con este usuario y contrasena; despues hay que usar los mismos.
# Si la carpeta data/ ya existia con otros datos, se borra para crear la base de nuevo.
# Tambien se pueden reemplazar con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
app.db.url=jdbc:h2:file:./data/parking
app.db.username=parking
app.db.password=parking2026

# Consola web de H2 (como en business-sales-project): http://localhost:8080/h2
# Solo entra el administrador con sesion iniciada, y H2 solo acepta conexiones desde este equipo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2
