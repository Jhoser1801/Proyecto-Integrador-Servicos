spring.application.name=parking-integrator
server.port=8080
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
# permite PUT/DELETE desde formularios HTML
spring.mvc.hiddenmethod.filter.enabled=true

# Base de datos H2 (el usuario y la contraseña van aqui).
# La primera vez, H2 crea la base con este usuario y contraseña; después hay que usar los mismos.

app.db.url=jdbc:h2:file:./data/parking
app.db.username=parking
app.db.password=parking2026

# Consola web de H2: http://localhost:8080/h2
# Solo entra el administrador con sesión iniciada, y H2 solo acepta conexiones desde este equipo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2
