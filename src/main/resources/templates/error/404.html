<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página no encontrada')}"></head>
<body>
<main class="center">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>No encontramos lo que buscabas. Revisa la dirección o vuelve al inicio.</p>
    <p th:if="${message}" th:text="${message}"></p>
    <a class="btn" th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
