<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Parqueadero'">Parqueadero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@700;800&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="nav">
    <div class="topbar-inner">
        <a class="logo" th:href="@{/}"><span class="logo-p" aria-hidden="true">P</span>Parqueadero</a>
        <nav aria-label="Principal">
            <a th:href="@{/}">Cupos</a>
            <a th:href="@{/tickets}">Tickets</a>
            <a th:href="@{/tariffs}" sec:authorize="hasRole('ADMIN')">Tarifas</a>
            <a th:href="@{/slots}" sec:authorize="hasRole('ADMIN')">Administrar cupos</a>
            <a th:href="@{/reports}" sec:authorize="hasRole('ADMIN')">Reportes</a>
        </nav>
        <div class="who">
            <span><span sec:authentication="name">usuario</span></span>
            <form th:action="@{/logout}" method="post"><button class="compact" type="submit">Salir</button></form>
        </div>
    </div>
</header>
<div th:fragment="messages">
    <div class="notice success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="notice error" role="alert" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
