<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tarifas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Tarifas por hora</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="card">
        <p>Cada hora o fracción se cobra como hora completa (mínimo una hora).</p>
        <form th:action="@{/tariffs}" th:object="${form}" method="post">
            <label for="vehicleType">Tipo de vehículo</label>
            <select id="vehicleType" th:field="*{vehicleType}">
                <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="#{'vehicleType.' + ${t}}"></option>
            </select>
            <label for="hourlyRate">Valor por hora</label>
            <input id="hourlyRate" th:field="*{hourlyRate}" type="number" min="1" step="1" required>
            <button type="submit">Guardar tarifa</button>
        </form>
    </div>
    <div class="card">
        <table>
            <thead><tr><th>Tipo</th><th>Valor por hora</th></tr></thead>
            <tbody>
            <tr th:each="t : ${tariffs}">
                <td th:text="#{'vehicleType.' + ${t.vehicleType}}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(t.hourlyRate, 1, 'POINT', 0, 'COMMA')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
