<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tarifas')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="stack">
    <h1>Tarifas por hora</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <p>Cada hora o fracción se cobra como hora completa. El mínimo es una hora.</p>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Vehículo</th><th class="num">Valor por hora</th><th>Actualizar</th></tr></thead>
            <tbody>
            <tr th:each="t : ${tariffs}">
                <td th:text="${t.vehicleType.visualName}"></td>
                <td class="num" th:text="'$' + ${#numbers.formatDecimal(t.hourlyRate, 1, 'POINT', 0, 'COMMA')}"></td>
                <td>
                    <form class="inline-form" th:action="@{/tariffs/{type}(type=${t.vehicleType})}" th:method="put">
                        <input type="number" name="hourlyRate" th:value="${t.hourlyRate.toBigInteger()}" min="1" step="1" required
                               th:aria-label="'Nuevo valor por hora para ' + ${t.vehicleType.visualName}">
                        <button type="submit" class="compact">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
