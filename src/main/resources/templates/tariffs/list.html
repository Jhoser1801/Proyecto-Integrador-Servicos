<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tarifas')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="stack">
    <h1>Tarifas por hora</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <p>Cada hora o fracción se cobra como hora completa. El mínimo es una hora.</p>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Vehículo</th><th class="num">Valor por hora</th></tr></thead>
            <tbody>
            <tr th:each="t : ${tariffs}">
                <td th:text="#{'vehicleType.' + ${t.vehicleType}}"></td>
                <td class="num" th:text="'$' + ${#numbers.formatDecimal(t.hourlyRate, 1, 'POINT', 0, 'COMMA')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <section class="panel" aria-labelledby="set-tariff">
        <h2 id="set-tariff">Cambiar tarifa</h2>
        <form class="inline-form" th:action="@{/tariffs}" th:object="${form}" method="post">
            <div class="field">
                <label for="vehicleType">Vehículo</label>
                <select id="vehicleType" th:field="*{vehicleType}">
                    <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="#{'vehicleType.' + ${t}}"></option>
                </select>
            </div>
            <div class="field">
                <label for="hourlyRate">Valor por hora</label>
                <input id="hourlyRate" th:field="*{hourlyRate}" type="number" min="1" step="1" required>
            </div>
            <button type="submit">Guardar tarifa</button>
        </form>
    </section>
</main>
</body>
</html>
