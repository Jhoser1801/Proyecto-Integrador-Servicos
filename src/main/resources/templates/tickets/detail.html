<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ticket')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <article class="receipt">
        <h1 th:text="${ticket.status.name() == 'CLOSED'} ? 'Comprobante de salida' : 'Ticket de entrada'">Comprobante</h1>
        <dl>
            <div class="row"><dt>Placa</dt><dd class="plate" th:text="${ticket.plate}"></dd></div>
            <div class="row"><dt>Vehículo</dt><dd th:text="${ticket.vehicleType.visualName}"></dd></div>
            <div class="row"><dt>Cupo</dt><dd th:text="${slot != null} ? ${slot.code} : '-'"></dd></div>
            <div class="row"><dt>Entrada</dt><dd th:text="${#temporals.format(ticket.entryAt, 'dd/MM/yyyy HH:mm')}"></dd></div>
            <div class="row" th:if="${ticket.exitAt != null}"><dt>Salida</dt><dd th:text="${#temporals.format(ticket.exitAt, 'dd/MM/yyyy HH:mm')}"></dd></div>
        </dl>
        <div class="total" th:if="${ticket.totalAmount != null}">
            <span>Total a pagar</span>
            <strong th:text="'$' + ${#numbers.formatDecimal(ticket.totalAmount, 1, 'POINT', 0, 'COMMA')}"></strong>
        </div>
        <p th:if="${ticket.status.name() == 'OPEN'}" style="margin:1rem 0 0">El vehículo sigue dentro del parqueadero.</p>
    </article>
    <div class="actions">
        <a class="btn" th:if="${ticket.status.name() == 'CLOSED'}" th:href="@{/tickets/{id}/receipt.pdf(id=${ticket.id})}">Descargar comprobante en PDF</a>
        <a class="btn quiet" th:href="@{/tickets}">Volver a tickets</a>
    </div>
</main>
</body>
</html>
