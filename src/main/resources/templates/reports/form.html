<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <h1>Reporte de ingresos</h1>
    <p>Suma lo cobrado en los tickets cerrados dentro del rango de fechas.</p>
    <section class="panel" style="max-width:34rem">
        <form class="inline-form" th:action="@{/reports/revenue.pdf}" method="get">
            <div class="field">
                <label for="from">Desde</label>
                <input id="from" name="from" type="date" th:value="${from}" required>
            </div>
            <div class="field">
                <label for="to">Hasta</label>
                <input id="to" name="to" type="date" th:value="${to}" required>
            </div>
            <button type="submit">Descargar PDF</button>
        </form>
    </section>
</main>
</body>
</html>
