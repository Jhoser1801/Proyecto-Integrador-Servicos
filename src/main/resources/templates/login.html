<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="public">
<header th:replace="~{fragments/layout :: publicbar('Sistema de gestión de parqueaderos')}"></header>
<main class="auth">
    <section class="card auth__card">
        <div class="auth__head">
            <span class="sidebar__logo" aria-hidden="true">P</span>
            <h1>Iniciar sesión</h1>
            <p class="muted">Acceso exclusivo para personal autorizado</p>
        </div>
        <div class="alert alert--error" role="alert" th:if="${param.error}">
            <span class="icon" aria-hidden="true">error</span>
            <div><strong>Credenciales incorrectas</strong><br><span class="small">El usuario o la contraseña no son válidos. Verifica e intenta de nuevo.</span></div>
        </div>
        <div class="alert alert--success" role="status" th:if="${param.logout}"><span class="icon" aria-hidden="true">check_circle</span>Cerraste la sesión.</div>
        <form class="form" th:action="@{/login}" method="post">
            <label class="field">
                <span>Usuario</span>
                <input name="username" autocomplete="username" required autofocus>
            </label>
            <label class="field">
                <span>Contraseña</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn--block" type="submit"><span class="icon" aria-hidden="true">login</span>Ingresar</button>
        </form>
        <a class="btn btn--secondary btn--block" th:href="@{/cupos}"><span class="icon" aria-hidden="true">local_parking</span>Ver disponibilidad</a>
    </section>
</main>
</body>
</html>
