<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<main class="center-screen">
    <div class="sign">
        <span class="login-mark" aria-hidden="true">P</span>
        <h1>Ingresa al parqueadero</h1>
        <div class="notice error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
        <div class="notice success" role="status" th:if="${param.logout}">Cerraste la sesión.</div>
        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</main>
</body>
</html>
