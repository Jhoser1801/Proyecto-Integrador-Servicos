<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Estado del parqueadero</h1>
    <div class="grid">
        <div class="card stat"><strong th:text="${freeCars}">0</strong>Cupos de carro libres</div>
        <div class="card stat"><strong th:text="${freeMotorcycles}">0</strong>Cupos de moto libres</div>
        <div class="card stat"><strong th:text="${openTickets.size()}">0</strong>Vehículos dentro</div>
    </div>

    <div class="card">
        <h2>Cupos</h2>
        <div class="table-wrap"><table>
            <thead><tr><th>Cupo</th><th>Tipo</th><th>Estado</th></tr></thead>
            <tbody>
            <tr th:each="s : ${slots}">
                <td th:text="${s.code}"></td>
                <td th:text="#{'vehicleType.' + ${s.vehicleType}}"></td>
                <td><span class="badge" th:classappend="${s.status}" th:text="#{'slotStatus.' + ${s.status}}"></span></td>
            </tr>
            </tbody>
        </table></div>
    </div>

    <div class="card">
        <h2>Vehículos dentro</h2>
        <p th:if="${openTickets.isEmpty()}">No hay vehículos dentro.</p>
        <div class="table-wrap" th:unless="${openTickets.isEmpty()}"><table>
            <thead><tr><th>Placa</th><th>Tipo</th><th>Entrada</th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${openTickets}">
                <td th:text="${t.plate}"></td>
                <td th:text="#{'vehicleType.' + ${t.vehicleType}}"></td>
                <td th:text="${#temporals.format(t.entryAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <form th:action="@{/tickets/{id}/check-out(id=${t.id})}" method="post">
                        <button class="small" type="submit">Registrar salida</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table></div>
    </div>
</main>
</body>
</html>
