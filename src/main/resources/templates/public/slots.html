<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cupos disponibles')}"></head>
<body>
<header th:replace="~{fragments/layout :: publicnav}"></header>
<main>
    <h1>Cupos disponibles</h1>
    <p>Se actualiza solo cada 30 segundos.</p>
    <div class="avail">
        <section class="panel" aria-labelledby="cars-title">
            <h2 id="cars-title">Carros</h2>
            <p class="avail-count" th:classappend="${freeCars == 0} ? 'none'">
                <strong th:text="${freeCars}">0</strong>
                <span th:text="${freeCars == 1} ? 'cupo libre' : 'cupos libres'">cupos libres</span>
            </p>
            <p class="hint" th:text="${freeCars == 0} ? 'Por ahora no hay cupos libres para carros.' : 'De ' + ${totalCars} + ' cupos para carros.'"></p>
        </section>
        <section class="panel" aria-labelledby="moto-title">
            <h2 id="moto-title">Motos</h2>
            <p class="avail-count" th:classappend="${freeMotorcycles == 0} ? 'none'">
                <strong th:text="${freeMotorcycles}">0</strong>
                <span th:text="${freeMotorcycles == 1} ? 'cupo libre' : 'cupos libres'">cupos libres</span>
            </p>
            <p class="hint" th:text="${freeMotorcycles == 0} ? 'Por ahora no hay cupos libres para motos.' : 'De ' + ${totalMotorcycles} + ' cupos para motos.'"></p>
        </section>
    </div>
</main>
</body>
</html>
