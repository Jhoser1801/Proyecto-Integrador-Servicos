<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administrar cupos')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="stack">
    <h1>Administrar cupos</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <section class="panel" aria-labelledby="new-slot">
        <h2 id="new-slot">Crear cupo</h2>
        <form class="inline-form" th:action="@{/slots}" th:object="${form}" method="post">
            <div class="field">
                <label for="code">Código</label>
                <input id="code" th:field="*{code}" maxlength="10" placeholder="A6" required>
            </div>
            <div class="field">
                <label for="vehicleType">Tipo de vehículo</label>
                <select id="vehicleType" th:field="*{vehicleType}">
                    <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t.visualName}"></option>
                </select>
            </div>
            <button type="submit">Crear cupo</button>
        </form>
    </section>
    <p>Un cupo ocupado no se puede editar ni eliminar. Un cupo que ya tuvo tickets tampoco se elimina (se conserva el historial) ni cambia de tipo de vehículo.</p>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Estado</th><th>Editar cupo</th><th>Eliminar</th></tr></thead>
            <tbody>
            <tr th:each="s : ${slots}">
                <td><span class="state" th:classappend="${s.status.name() == 'OCCUPIED'} ? 'open'" th:text="${s.status.visualName}"></span></td>
                <td>
                    <form class="inline-form" th:action="@{/slots/{id}(id=${s.id})}" th:method="put">
                        <input name="code" th:value="${s.code}" maxlength="10" required class="plate"
                               th:disabled="${!s.free}" th:aria-label="'Código del cupo ' + ${s.code}">
                        <select name="vehicleType" th:disabled="${!s.free}" th:aria-label="'Tipo del cupo ' + ${s.code}">
                            <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t.visualName}"
                                    th:selected="${t == s.vehicleType}"></option>
                        </select>
                        <button type="submit" class="compact" th:disabled="${!s.free}">Guardar</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/slots/{id}(id=${s.id})}" th:method="delete"
                          th:attr="onsubmit=|return confirm('¿Eliminar el cupo ${s.code}?')|">
                        <button type="submit" class="compact danger" th:disabled="${!s.free}">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
