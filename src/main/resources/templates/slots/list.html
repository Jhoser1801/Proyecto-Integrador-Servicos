<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administrar cupos')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="stack">
    <h1>Administrar cupos</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <section class="panel" aria-labelledby="new-slot">
        <h2 id="new-slot">Crear cupo</h2>
        <form class="inline-form" th:action="@{/slots}" th:object="${form}" method="post">
            <div class="field">
                <label for="code">Código</label>
                <input id="code" th:field="*{code}" maxlength="10" placeholder="A6" required>
            </div>
            <div class="field">
                <label for="vehicleType">Tipo de vehículo</label>
                <select id="vehicleType" th:field="*{vehicleType}">
                    <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t.visualName}"></option>
                </select>
            </div>
            <button type="submit">Crear cupo</button>
        </form>
    </section>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Cupo</th><th>Tipo</th><th>Estado</th></tr></thead>
            <tbody>
            <tr th:each="s : ${slots}">
                <td class="plate" th:text="${s.code}"></td>
                <td th:text="${s.vehicleType.visualName}"></td>
                <td><span class="state" th:classappend="${s.status.name() == 'OCCUPIED'} ? 'open'" th:text="${s.status.visualName}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
